# Bundled device profiles, re-merged with user ones at launch; edit to tune.

[[profiles]]
id = "ateis-btq-vm"
name = "ATEIS BOUTIQUE BTQ-VM4/VM8"
vendor = "ATEIS"
model = "BOUTIQUE BTQ-VM4/VM8 250W/500W PA/VA"

# Native DSP is 48 kHz / 24-bit; PA zones are mono line outputs.
[profiles.audio]
sample_rate = 48000
channels = 1
bit_depth = 24
packet_duration_ms = 20

# Recode to 48kHz/24-bit WAV, band-limited to amplifier response 50Hz-18kHz.
[profiles.converter]
delay_ms = 0
volume_db = -6.0
fade_start_seconds = 0.0
fade_duration_seconds = 0.0
sample_rate = 48000
channels = 1
codec = "pcm_s24le"
format = "wav"
map = "0:a:0"
output_suffix = "_BTQ_VM_48k24.wav"
highpass_hz = 50
lowpass_hz = 18000

# Payload type 97 = dynamic L24 PCM (RFC 3190); confirm with device docs.
[profiles.network]
rtp_payload_type = 97
default_multicast_ip = "239.10.10.20"
default_port = 5004
